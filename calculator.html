        function calculateMaturityAmount() {

            var p = document.getElementById("principalMA").value;
            var t = document.getElementById("timeMA").value;
            var n = document.getElementById("compoundMA").value;
            var r = document.getElementById("interestMA").value;
            var n = 12;

            t = parseInt(t);
            p = parseFloat(p);

            s = parseFloat(r);
            r = (s / 100);


            var g = 12 / n;

            var a = t * n / 12;

            var b = (1 + (r / n));


            var h = t / 12;

            y = (((Math.pow(b, a)) - 1) / h) * 100;


            maturity_amount = (p * t) + ((t * (t + 1) * p * s) / 2400);

            amount = Math.ceil(maturity_amount);

            document.getElementById("ins_val").innerHTML = "<strong><span style='color:green;font-size:20px;float:right;'>Rs. " + p + "<span></strong>";
            document.getElementById("mat_val").innerHTML = "<strong><span style='color:green;font-size:20px;float:right;'>Rs. " + Math.round(amount) + "<span></strong>";


            document.getElementById("res_jl").style.display = 'none';
            //document.getElementById("res_rd").style.display = 'block';
            document.getElementById("res_fd").style.display = 'none';

            res1 = "<div><span style='text-decoration:underline;'>Installment (monthly):</span><br> Rs. " + p + "<div>";
            res1 += "<div><span  style='text-decoration:underline;'>Maturity Amount:</span><br> Rs. " + Math.round(amount) + "<div>";
            var myElement = document.getElementById("myList");
            myElement.innerHTML = res1;
            modal.style.display = "block";

        }

            var n = document.getElementById('selectIA').value;
            var r = document.getElementById('interestIA').value;
            var x = calculate_x(r, n);
            var z = 0;
            for (var i = t; i >= 1; i--) {

        function calMatVal(principalVal, interestVal, tenureVal, tenurePeriodVal, frequencyVal) {
            var fdMatVal = 0;
            var retStr = "";
            if (tenureVal <= 90 && tenurePeriodVal == 365) {
                frequencyVal = 0;
            }

            if (frequencyVal == 0)	//	Simple interest
            {
                fdMatVal = principalVal * (1 + ((interestVal * tenureVal) / (tenurePeriodVal * 100)));
                //retStr = retStr + "Simple Interest = " +fdMatVal;
            }
            else	//	Compound interest
            {
                var val1 = 1 + interestVal / (100 * frequencyVal);
                var val2 = (tenureVal * frequencyVal / tenurePeriodVal);
                var val3 = 0;

                val3 = Math.pow(val1, val2);
                fdMatVal = (principalVal * val3);
                //retStr = retStr + "Compund Interest = " +fdMatVal;
            }

            retStr = retStr + fdMatVal.toFixed(2);
            return (retStr);
        }

        }
